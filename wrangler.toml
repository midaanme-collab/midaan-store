name = "midaan-store"
main = "worker/index.ts"
compatibility_date = "2026-10-28"
workers_dev = true

routes = [
  { pattern = "midaan.net", custom_domain = true },
  { pattern = "www.midaan.net", custom_domain = true }
]

[assets]
directory = "./out"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = ["/build-info.json", "/api/*"]

